name: Generate snake animation

on:
  schedule: # Ejecuta la animación cada 12 horas
    - cron: "0 */12 * * *"

  workflow_dispatch: # Permite ejecutar el workflow manualmente desde la pestaña Actions

  push:
    branches:
      - main # Genera la animación cuando haces push a la rama main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: push snake.svg to the main branch inside output directory
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: main
          build_dir: dist
          destination_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
